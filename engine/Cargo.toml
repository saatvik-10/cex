[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
bigdecimal = { version = "0.4", features = ["serde"] }
thiserror = "2"
dotenvy = "0.15"

diesel = { version = "2.2", features = ["postgres", "uuid", "chrono", "numeric"] }
diesel-async = { version = "0.5", features = ["postgres", "bb8"] }
bb8 = "0.8"

tokio = { version = "1", features = ["macros", "sync", "time", "fs", "io-util", "rt-multi-thread"] }

redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "streams"] }