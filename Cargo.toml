[package]
name = "rs"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.15.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

dotenvy = "0.15"

argon2 = { version = "0.5", features = ["std"] }
jsonwebtoken = "9"
sha2 = "0.10"

bigdecimal = { version = "0.4", features = ["serde"] }
dashmap = "6"

diesel = { version = "2.2", features = ["postgres", "uuid", "chrono", "numeric"] }
diesel-async = { version = "0.5", features = ["postgres", "bb8"] }
bb8 = "0.8"

futures-util = "=0.3.31"

thiserror = "2"
